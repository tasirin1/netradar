name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
    - name: Checkout (sejarah penuh untuk guard changelog)
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Pastikan CHANGELOG diperbarui
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          BASE="$PR_BASE_SHA"
        else
          BASE="$PUSH_BEFORE"
        fi
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "Base SHA tidak tersedia; guard dilewati."
          exit 0
        fi
        CHANGED=$(git diff --name-only "$BASE"...HEAD)
        echo "File berubah:"
        echo "$CHANGED"
        if echo "$CHANGED" | grep -qE '^(app/src|scripts/|\.github/workflows/|app/build\.gradle\.kts)'; then
          if ! echo "$CHANGED" | grep -q '^CHANGELOG\.md$'; then
            echo "::error::Ada perubahan kode/CI tanpa pembaruan CHANGELOG.md. Update CHANGELOG.md di PR ini."
            exit 1
          fi
        else
          echo "Tidak ada perubahan kode/CI — CHANGELOG tidak wajib."
        fi

    - name: Cek kesehatan keystore (fingerprint + masa berlaku)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/check_ks.jks
        STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
        FINGERPRINT=$(keytool -list -v -keystore /tmp/check_ks.jks -storepass "$STORE_PASS" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //;s/://g;s/ .*//' | tr 'A-F' 'a-f')
        EXPIRY=$(keytool -list -v -keystore /tmp/check_ks.jks -storepass "$STORE_PASS" 2>/dev/null | grep 'Valid from' | head -1)
        EXPIRY_DATE=$(echo "$EXPIRY" | grep -oP 'until: \K.*' | head -1)
        EXPIRY_EPOCH=$(date -d "$EXPIRY_DATE" +%s 2>/dev/null || echo 0)
        NOW_EPOCH=$(date +%s)
        DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
        echo "Fingerprint: $FINGERPRINT"
        echo "Masa berlaku sisa: $DAYS_LEFT hari"
        if [ "$FINGERPRINT" != "c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1" ]; then
          echo "::error::Keystore fingerprint tidak cocok! Diharapkan c2785a61... dapat $FINGERPRINT"
          exit 1
        fi
        if [ "$DAYS_LEFT" -lt 90 ]; then
          echo "::error::Keystore akan expired dalam $DAYS_LEFT hari (< 90)! Segera perbarui."
          exit 1
        elif [ "$DAYS_LEFT" -lt 180 ]; then
          echo "::warning::Keystore akan expired dalam $DAYS_LEFT hari (< 180)."
        fi
        rm -f /tmp/check_ks.jks
        echo "✅ Keystore resmi Tasirin — fingerprint & masa berlaku OK"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      run: |
        curl -sLo /tmp/tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        export ANDROID_SDK_ROOT=/opt/android
        sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        unzip -q /tmp/tools.zip -d /tmp/
        sudo mv /tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest/
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1
        echo "ANDROID_SDK_ROOT=/opt/android" >> $GITHUB_ENV
        echo "ANDROID_HOME=/opt/android" >> $GITHUB_ENV

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.9

    - name: Build & test APK release (keystore resmi Tasirin)
      env:
        ANDROID_SDK_ROOT: /opt/android
        ANDROID_HOME: /opt/android
        KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        gradle testDebugUnitTest lintDebug assembleRelease --no-daemon

    - name: Verifikasi tanda tangan APK release
      run: |
        FINGERPRINT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep 'SHA-256 digest:' | head -1 | sed 's/.*SHA-256 digest: //;s/://g;s/ //g' | tr 'A-F' 'a-f')
        echo "Fingerprint: $FINGERPRINT"
        if [ "$FINGERPRINT" != "c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1" ]; then
          echo "::error::Keystore tidak cocok! Diharapkan c2785a61... dapat $FINGERPRINT"
          exit 1
        fi
        echo "✅ Keystore resmi Tasirin terverifikasi"

    - name: VirusTotal scan APK release
      env:
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
      run: |
        APK="app/build/outputs/apk/release/app-release.apk"
        echo "Mengunggah APK ke VirusTotal..."
        UPLOAD=$(curl -s --connect-timeout 30 --retry 3 --retry-delay 5 -X POST "https://www.virustotal.com/api/v3/files" \
          -H "x-apikey: $VT_API_KEY" \
          -F "file=@$APK")
        ANALYSIS_ID=$(echo "$UPLOAD" | jq -r '.data.id // empty')
        if [ -z "$ANALYSIS_ID" ]; then
          echo "::warning::Gagal mengunggah ke VirusTotal (mungkin kuota habis). Lewati scan."
          exit 0
        fi
        echo "Analysis ID: $ANALYSIS_ID — menunggu hasil..."
        for i in $(seq 1 30); do
          sleep 15
          RESULT=$(curl -s --connect-timeout 15 --retry 2 --retry-delay 3 "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
            -H "x-apikey: $VT_API_KEY")
          STATUS=$(echo "$RESULT" | jq -r '.data.attributes.status // empty')
          if [ "$STATUS" = "completed" ]; then
            STATS=$(echo "$RESULT" | jq -r '.data.attributes.stats')
            MALICIOUS=$(echo "$RESULT" | jq -r '.data.attributes.stats.malicious')
            SUSPICIOUS=$(echo "$RESULT" | jq -r '.data.attributes.stats.suspicious')
            echo "Hasil VirusTotal: $STATS"
            echo "Malicious: $MALICIOUS, Suspicious: $SUSPICIOUS"
            if [ "$MALICIOUS" -gt 0 ] || [ "$SUSPICIOUS" -gt 2 ]; then
              echo "::warning::VirusTotal mendeteksi $MALICIOUS malicious, $SUSPICIOUS suspicious engine."
            else
              echo "✅ VirusTotal bersih"
            fi
            break
          fi
          echo "  ($i/30) status: $STATUS"
        done

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: NetScan-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Cek ukuran APK (maks 5 MB)
      run: |
        APK="app/build/outputs/apk/release/app-release.apk"
        SIZE=$(stat -c%s "$APK")
        SIZE_MB=$((SIZE / 1048576))
        SIZE_KB=$((SIZE / 1024))
        echo "Ukuran APK: ${SIZE_KB} KB (${SIZE_MB} MB)"
        if [ "$SIZE" -gt 5242880 ]; then
          echo "::error::APK melebihi 5 MB (${SIZE_KB} KB) — optimasi resource/dependency!"
          exit 1
        fi
        echo "✅ Ukuran APK dalam batas aman"

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
        CODE=${GITHUB_RUN_NUMBER}
        OUT="netradar-v${VER}-${CODE}.apk"
        cp app/build/outputs/apk/release/app-release.apk "$OUT"
        MAPPING="netradar-v${VER}-${CODE}-mapping.txt"
        cp app/build/outputs/mapping/release/mapping.txt "$MAPPING"
        gh release delete "v${VER}" --yes --cleanup-tag || true
        gh release create "v${VER}" "$OUT" "$MAPPING" \
          --title "NetRadar v${VER} (build ${CODE})" \
          --notes "APK rilis terbaru (build ${CODE}) + mapping.txt untuk deobfuscation crash R8. Ditandatangani dengan keystore resmi Tasirin (sama dengan Tasirin Download Manager & Vaultwarden Host) — update-over-install mulus." \
          --latest
