name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK
      run: |
        curl -sLo /tmp/tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        export ANDROID_SDK_ROOT=/opt/android
        sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        unzip -q /tmp/tools.zip -d /tmp/
        sudo mv /tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest/
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1
        echo "ANDROID_SDK_ROOT=/opt/android" >> $GITHUB_ENV
        echo "ANDROID_HOME=/opt/android" >> $GITHUB_ENV

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 8.5

    - name: Build & test APK release (keystore resmi Tasirin)
      env:
        ANDROID_SDK_ROOT: /opt/android
        ANDROID_HOME: /opt/android
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        gradle testDebugUnitTest assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: NetScan-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
        CODE=${GITHUB_RUN_NUMBER}
        OUT="netradar-v${VER}-${CODE}.apk"
        cp app/build/outputs/apk/release/app-release.apk "$OUT"
        gh release delete "v${VER}" --yes --cleanup-tag || true
        gh release create "v${VER}" "$OUT" \
          --title "NetRadar v${VER} (build ${CODE})" \
          --notes "APK rilis terbaru (build ${CODE}). Ditandatangani dengan keystore resmi Tasirin (sama dengan Tasirin Download Manager & Vaultwarden Host) — update-over-install mulus." \
          --latest
