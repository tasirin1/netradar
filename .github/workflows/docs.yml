name: Docs

on:
  pull_request:
    paths:
      - "README.md"
      - "README.en.md"

jobs:
  sync-heading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Periksa struktur heading README (ID vs EN)
        run: |
          python3 scripts/check_repo.py --readme
